name: Daily data refresh
on:
  schedule:
    - cron: "0 6 * * *"       # 06:00 UTC every day
  workflow_dispatch: {}         # adds a manual "Run workflow" button
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests psycopg2-binary python-dotenv tqdm
      - name: Ingest new notices
        run: python ingest.py --niche green --days 3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Enrich new lots
        run: python enrich_tenders_xml.py --niche green
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}