name: daily-refresh

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests psycopg2-binary python-dotenv tqdm
      - name: Ingest new tenders (last 3 days)
        run: python ingest.py --niche green --days 3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Enrich tenders (lots, regions, value)
        run: python enrich_tenders_xml.py --niche green
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Reclassify (relevance + sub-sectors)
        run: python reclassify.py --niche green --apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}